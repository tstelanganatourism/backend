user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    # Connection Limits & Uploads
    client_max_body_size 25M; # Support brochure PDF uploads
    keepalive_timeout 65;

    # Rate Limiting Zones
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=booking_limit:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=60r/m;
    limit_req_zone $binary_remote_addr zone=otp_limit:10m rate=3r/m;

    upstream fastapi_backend {
        server 127.0.0.1:8000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name www.tstelanganatourism.com tstelanganatourism.com;

        # Redirect standard HTTP to HTTPS
        location / {
            return 301 https://www.tstelanganatourism.com$request_uri;
        }
    }

    server {
        listen 80;
        listen 443 ssl;
        server_name www.aptourismpapikondalu.org aptourismpapikondalu.org www.telanganatourismpapikondaluonlinebooking.co.in telanganatourismpapikondaluonlinebooking.co.in;

        ssl_certificate /etc/letsencrypt/live/tstelanganatourism.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/tstelanganatourism.com/privkey.pem;

        return 301 https://www.tstelanganatourism.com$request_uri;
    }

    server {
        listen 443 ssl http2;
        server_name www.tstelanganatourism.com tstelanganatourism.com;

        # SSL Configuration
        ssl_certificate /etc/letsencrypt/live/tstelanganatourism.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/tstelanganatourism.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # Security Headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Next.js Frontend Static Assets
        location /_next/static/ {
            alias /var/www/tsboat.com/frontend/.next/static/;
            expires 365d;
            access_log off;
        }

        # Real-time SSE Streams (/api/v1/stream) - Buffering Disabled
        location /api/v1/stream/ {
            proxy_pass http://fastapi_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # CRITICAL: Disable all proxy buffering for active SSE
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding off;

            # Prevent connection timeouts for long-running connections (SSE client retry safety)
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # Standard API Proxies
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://fastapi_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        # Stricter Rate Limits for sensitive endpoints
        location /api/v1/auth/login {
            limit_req zone=login_limit burst=5 nodelay;
            proxy_pass http://fastapi_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location ~ ^/api/v1/auth/(send-otp|verify-otp) {
            limit_req zone=otp_limit burst=3 nodelay;
            proxy_pass http://fastapi_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/v1/public/bookings {
            limit_req zone=booking_limit burst=10 nodelay;
            proxy_pass http://fastapi_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Next.js Server Pages Routing
        location / {
            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }
    }
}
