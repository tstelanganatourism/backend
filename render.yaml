services:
  # FastAPI Web & Background Worker Service
  - type: web
    name: tsboat-api
    env: docker
    region: singapore # Closest to India for lowest latency
    plan: free # Explicitly use the 100% free plan
    dockerContext: .
    dockerfilePath: Dockerfile
    dockerCommand: "./start.sh"
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: ALLOWED_HOSTS
        value: '["tstelanganatourism.com","www.tstelanganatourism.com","*.onrender.com","localhost"]'
      - key: CORS_ORIGINS
        value: '["https://tstelanganatourism.com","https://www.tstelanganatourism.com"]'
      - key: FRONTEND_URL
        value: "https://tstelanganatourism.com"
