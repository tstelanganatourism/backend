services:
  # FastAPI Web & Background Worker Service (Combined to remain 100% Free)
  - type: web
    name: ts-tours-api
    env: python
    region: singapore # Closest to India for lowest latency
    plan: free # Explicitly use the 100% free plan
    buildCommand: "pip install -r requirements.txt && playwright install chromium --with-deps"
    startCommand: "bash start.sh"
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: ALLOWED_HOSTS
        value: "*"
      - key: CORS_ORIGINS
        value: "*"
