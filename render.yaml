services:
  # FastAPI Web & Background Worker Service (Combined to remain 100% Free)
  - type: web
    name: ts-tours-api
    env: python
    region: singapore # Closest to India for lowest latency
    plan: free # Explicitly use the 100% free plan
    buildCommand: "pip install -r requirements.txt && playwright install chromium"
    startCommand: "bash start.sh"
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: ALLOWED_HOSTS
        value: '["tsboattourism.org","www.tsboattourism.org","api.tsboattourism.org","*.onrender.com","localhost"]'
      - key: CORS_ORIGINS
        value: '["https://tsboattourism.org","https://www.tsboattourism.org"]'
